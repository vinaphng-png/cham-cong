<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm công</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#e8ecf0;--card:#fff;--ink:#17232f;--mute:#5d6b78;--line:#d2d9e0;--in:#0e7a68;--out:#b83a2b;--acc:#1f4e79;--dis:#c5cdd5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111920;--card:#1a2530;--ink:#e8eef4;--mute:#93a3b1;--line:#2c3a48;--in:#3cc0a7;--out:#ff7d6b;--acc:#7db4e6;--dis:#2b3743}}
:root[data-theme="dark"]{--bg:#111920;--card:#1a2530;--ink:#e8eef4;--mute:#93a3b1;--line:#2c3a48;--in:#3cc0a7;--out:#ff7d6b;--acc:#7db4e6;--dis:#2b3743}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif;padding-bottom:76px}
main{max-width:480px;margin:0 auto;padding:20px 16px}
h3{margin:0 0 8px;font-size:17px}
.clock{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.date{text-align:center;color:var(--mute);margin:2px 0 20px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{display:block;width:100%;font-size:22px;font-weight:700;padding:22px;margin-bottom:12px;color:#fff}
.big.in{background:var(--in)}.big.out{background:var(--out)}
.big:disabled{background:var(--dis);color:var(--mute);cursor:not-allowed}
.card{background:var(--card);border-radius:12px;padding:16px;margin-top:16px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span{color:var(--mute)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;border-radius:0;padding:16px 4px;color:var(--mute);font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.item{display:grid;grid-template-columns:52px 1fr;gap:0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.item b{grid-row:span 2;font-variant-numeric:tabular-nums;align-self:center}
.item small{color:var(--mute)}.item.off{opacity:.65}
label{display:block;margin:10px 0;color:var(--mute);font-size:14px}
input:not([type=checkbox]),textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:16px;margin:8px 0}
.chk input{width:20px;height:20px}
.days{display:grid;grid-template-columns:1fr 1fr}
.pri{background:var(--acc);color:#fff;font-weight:600}.danger{color:var(--out)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sh.on{display:flex}
.pan{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#tt.on{opacity:1}
.mute{color:var(--mute)}
</style></head><body>
<main id="v"></main>
<nav><div id="nv"></div></nav>
<div id="sh"></div><div id="tt"></div>
<script>
const K='chamcong-v1',DEF={start:'08:00',end:'17:00',lunch:'01:00',std:'08:00',ot:'17:00',days:[1,2,3,4,5,6],lateCut:false,otMin:30,nStart:'20:00',nEnd:'05:00',nBreak:'01:00'};
let S={s:{...DEF},r:{},d:{},a:null,su:0,sd:0};
try{const j=JSON.parse(localStorage.getItem(K)||'null');if(j){S.s={...DEF,...j.s};S.r=j.r||{};S.d=j.d||{};S.a=j.a||null;S.su=j.su||0;S.sd=j.sd||0}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function fixS(){if((S.s.v||0)<2){S.s.nEnd='05:00';S.s.v=2;S.sd=1;S.su=Date.now()}}fixS();
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const vd=k=>k.slice(8)+'/'+k.slice(5,7),vdy=k=>vd(k)+'/'+k.slice(0,4);
const hm=t=>{const a=t.split(':');return +a[0]*60+ +a[1]};
const f=m=>Math.floor(m/60)+':'+p2(m%60);const t2=m=>p2(Math.floor(m%1440/60))+':'+p2(m%60);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
const DN=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
let tab='t',HM=key(new Date()).slice(0,7),TA,TB;
{const n=new Date();TA=key(new Date(n.getFullYear(),n.getMonth(),1));TB=key(new Date(n.getFullYear(),n.getMonth()+1,0))}

function calc(r){
  if(!r||!r.in)return null;const s=S.s,i=hm(r.in),n=i>=hm(s.nStart);
  const st=n?hm(s.nStart):hm(s.start),en=n?hm(s.nEnd)+1440:hm(s.end),ot0=n?en:hm(s.ot),br=hm(n?s.nBreak:s.lunch),std=n?en-st-br:hm(s.std);
  const c={night:n,std,late:Math.max(0,i-st),ei:Math.max(i,st)};
  if(r.out){let o=hm(r.out);if(n&&o<=i)o+=1440;const raw=Math.max(0,o-ot0);c.ot=raw>=s.otMin?raw:0;c.eo=c.ot?o:Math.min(o,ot0);
    c.work=Math.max(0,c.eo-c.ei-br);c.early=Math.max(0,en-o);c.cong=s.lateCut?Math.min(1,Math.round(c.work/std*100)/100):1}
  return c}
function toast(t){const e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),5000)}

const SHEET='https://script.google.com/macros/s/AKfycbwroybGNxO3TEg_uqX9YP6P2ekxbvTwvbseZOipPurtAr7kJItwp4RQAgJg8LZt0kiFYA/exec';
const activeKey=()=>{const n=new Date(),t=key(n),y=key(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)),r=S.r[y];
  return r&&r.in&&!r.out&&hm(r.in)>=hm(S.s.nStart)&&n.getHours()<16&&!(S.r[t]&&S.r[t].in)?y:t};
function touch(k,e){S.r[k].u=Date.now();S.d[k]=e;save();sync()}
let ss='',busy=false,am='in';
const ssText=()=>ss||(Object.keys(S.d).length?'Chờ đồng bộ '+Object.keys(S.d).length+' thay đổi':'Đã đồng bộ');
const post=async o=>{const r=await fetch(SHEET,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});const x=await r.text();
  try{return JSON.parse(x)}catch(e){throw new Error('Máy chủ trả về không đúng định dạng: '+x.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,90))}};
const paint=()=>{const e=$('#ss');if(e)e.textContent=ssText()};
async function sync(manual){
  if(!S.a||busy)return;busy=true;ss='Đang đồng bộ...';paint();
  try{
    const ks=Object.keys(S.d),su=S.su,u={};
    const recs=ks.map(k=>{u[k]=S.r[k].u;return{date:k,event:S.d[k],...S.r[k]}});
    const res=await post({action:'sync',user:S.a.user,token:S.a.token,records:recs,settings:S.sd?{data:S.s,u:S.su}:null});
    if(!res.ok){if(res.auth){S.a=null;save();busy=false;ss='';render();toast(res.error);return}throw new Error(res.error)}
    ks.forEach(k=>{if(S.r[k]&&S.r[k].u===u[k])delete S.d[k]});if(S.su===su)S.sd=0;
    for(const k in res.records){const v=res.records[k],l=S.r[k];if(!l||(l.u||0)<v.u){S.r[k]=v;delete S.d[k]}}
    if(res.settings&&res.settings.u>(S.su||0)){S.s={...DEF,...res.settings.data};S.su=res.settings.u;fixS()}
    ss='';save();if(manual)toast('Đã đồng bộ')
  }catch(e){ss='Chưa đồng bộ được, sẽ tự thử lại';if(manual)toast(ss)}
  busy=false;paint();
  if(!$('#sh').classList.contains('on')&&tab!='c'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()}
async function logout(){await sync();
  if(Object.keys(S.d).length&&!confirm('Còn thay đổi chưa gửi lên bảng, đăng xuất sẽ mất chúng. Vẫn đăng xuất?'))return;
  S={s:{...DEF},r:{},d:{},a:null,su:0,sd:0};save();render()}
function vAuth(){
  const g=am=='up';
  $('#v').innerHTML=`<h3>${g?'Đăng ký':'Đăng nhập'}</h3>${g?'<label>Họ tên<input id="a_n" autocomplete="name"></label>':''}
  <label>Tên đăng nhập<input id="a_u" autocapitalize="none" autocomplete="username"></label>
  <label>Mật khẩu<input type="password" id="a_p" autocomplete="${g?'new-password':'current-password'}"></label>
  ${g?'<label>Nhập lại mật khẩu<input type="password" id="a_q" autocomplete="new-password"></label>':''}
  <div class="btns"><button class="pri" id="a_go">${g?'Đăng ký':'Đăng nhập'}</button></div>
  <p><a href="#" id="a_sw">${g?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</a></p>`;
  $('#a_sw').onclick=e=>{e.preventDefault();am=g?'in':'up';vAuth()};
  $('#a_go').onclick=async()=>{
    const user=$('#a_u').value.trim().toLowerCase(),pw=$('#a_p').value,nm=g?$('#a_n').value.trim():'';
    if(!user||!pw||(g&&!nm)){toast('Nhập đủ thông tin');return}
    if(g&&pw!==$('#a_q').value){toast('Mật khẩu nhập lại không khớp');return}
    const b=$('#a_go');b.disabled=true;
    try{const res=await post({action:g?'register':'login',user,password:pw,name:nm});
      if(!res.ok){toast(res.error);b.disabled=false;return}
      S.a={user,name:res.name,token:res.token};
      Object.keys(S.r).forEach(k=>{const r=S.r[k];if(r.in){if(!r.u)r.u=Date.now();S.d[k]='Nhập từ máy'}});
      if(g){S.su=Date.now();S.sd=1}
      save();tab='t';render();sync()
    }catch(e){toast('Lỗi: '+(e.message||'không kết nối được'));b.disabled=false}}}
function nav(){$('#nv').innerHTML=[['t','Chấm công'],['h','Lịch sử'],['s','Thống kê'],['c','Cài đặt']].map(a=>`<button data-t="${a[0]}" class="${tab==a[0]?'on':''}">${a[1]}</button>`).join('');
  document.querySelectorAll('#nv button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}

function render(){if(!S.a){$('#nv').innerHTML='';vAuth();return}nav();({t:vToday,h:vHist,s:vStat,c:vSet})[tab]();tick()}
function tick(){const e=$('#clk');if(!e)return;const n=new Date();e.textContent=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());
  $('#dt').textContent=DN[n.getDay()]+', '+vdy(key(n))}
setInterval(tick,1000);

function vToday(){
  const t=key(new Date()),k=activeKey(),r=S.r[k]||{},c=calc(r)||{};
  $('#v').innerHTML=`<div class="clock" id="clk"></div><div class="date" id="dt"></div>
  <button class="big in" id="bi" ${r.in?'disabled':''}>${r.in?'Đã chấm vào — '+r.in.slice(0,5):'Chấm vào'}</button>
  <button class="big out" id="bo" ${!r.in||r.out?'disabled':''}>${r.out?'Đã chấm ra — '+r.out.slice(0,5):'Chấm ra'}</button>
  <div class="card"><h3>Hôm nay${S.a.name?' — '+esc(S.a.name):''}</h3>${row('Vào',r.in?r.in.slice(0,5):'--:--')}${row('Ra',r.out?r.out.slice(0,5):'--:--')}
  ${row('Công',c.cong!=null?c.cong:'--')}${row('OT',c.ot!=null?f(c.ot):'--')}${c.late?row('Đi muộn',c.late+' phút'):''}</div><p class="mute" id="ss">${ssText()}</p>`;
  const now=()=>{const n=new Date();return p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds())};
  $('#bi').onclick=()=>{if(r.in)return;S.r[t]={in:now()};touch(t,'Chấm vào');render()};
  $('#bo').onclick=()=>{const x=S.r[k];if(!x||!x.in||x.out)return;x.out=now();touch(k,'Chấm ra');render()}}

function vHist(){
  const [y,mo]=HM.split('-').map(Number),last=new Date(y,mo,0).getDate(),today=key(new Date());let h='';
  for(let d=last;d>=1;d--){const k=HM+'-'+p2(d);if(k>today)continue;const r=S.r[k],wd=new Date(y,mo-1,d).getDay();
    if(r&&r.in){const c=calc(r);h+=`<div class="item" data-k="${k}"><b>${vd(k)}</b><span>${r.in.slice(0,5)} → ${r.out?r.out.slice(0,5):'--:--'}</span><small>${r.out?'Công: '+c.cong+' · OT: '+f(c.ot):'Chưa chấm ra'}${r.note?' · '+esc(r.note):''}</small></div>`}
    else if(S.s.days.includes(wd))h+=`<div class="item off" data-k="${k}"><b>${vd(k)}</b><span>Nghỉ</span><small>Bấm để nhập giờ nếu quên chấm</small></div>`}
  $('#v').innerHTML=`<h3>Lịch sử chấm công</h3><label>Tháng<input type="month" id="hm" value="${HM}"></label>${h||'<p class="mute">Chưa có ngày nào trong tháng này.</p>'}`;
  $('#hm').onchange=e=>{if(e.target.value){HM=e.target.value;vHist()}};
  document.querySelectorAll('.item').forEach(e=>e.onclick=()=>sheet(e.dataset.k))}

function sum(r){const c=calc(r),s=S.s;if(!c)return'<p class="mute">Nhập giờ vào để xem kết quả.</p>';
  
  return row('Giờ vào tính',t2(c.ei))+row('Giờ ra tính',c.eo!=null?t2(c.eo):'--')+row('Loại ca',c.night?'Ca đêm':'Ca ngày')+row('Giờ làm chuẩn',f(c.std))+row('Nghỉ giữa ca',c.night?s.nBreak:s.lunch)+row('Thời gian làm',c.work!=null?f(c.work):'--')+row('Công',c.cong!=null?c.cong.toFixed(2):'--')+row('OT',c.ot!=null?f(c.ot):'--')+row('Đi muộn',f(c.late))+row('Về sớm',c.early!=null?f(c.early):'--')}
function sheet(k){
  const r=S.r[k]||{},sh=$('#sh');
  sh.innerHTML=`<div class="pan"><h3>${vdy(k)}</h3>
  <label>Chấm vào<input type="time" step="1" id="ei" value="${r.in||''}"></label>
  <label>Chấm ra<input type="time" step="1" id="eo" value="${r.out||''}"></label>
  <div id="sm">${sum(r)}</div>
  <label>Lý do sửa<input id="er" value="${esc(r.reason||'')}" placeholder="Quên chấm công"></label>
  <label>Ghi chú<textarea id="en" rows="2" placeholder="Đi công tác, làm thứ 7...">${esc(r.note||'')}</textarea></label>
  <div class="btns"><button class="pri" id="xs">Lưu</button><button id="xc">Đóng</button>${S.r[k]&&S.r[k].in?'<button class="danger" id="xd">Xoá ngày</button>':''}</div></div>`;
  sh.classList.add('on');
  const cur=()=>({in:$('#ei').value||null,out:$('#eo').value||null});
  const upd=()=>{$('#sm').innerHTML=sum(cur())};
  $('#ei').oninput=upd;$('#eo').oninput=upd;
  $('#xc').onclick=()=>sh.classList.remove('on');
  sh.onclick=e=>{if(e.target===sh)sh.classList.remove('on')};
  $('#xs').onclick=()=>{const v=cur();
    if(!v.in){toast('Cần nhập giờ vào');return}
    if(v.out&&hm(v.out)<=hm(v.in)&&hm(v.in)<hm(S.s.nStart)){toast('Giờ ra phải sau giờ vào');return}
    S.r[k]={in:v.in,out:v.out,reason:$('#er').value.trim(),note:$('#en').value.trim()};touch(k,'Sửa');sh.classList.remove('on');render();toast('Đã lưu')};
  const xd=$('#xd');if(xd)xd.onclick=()=>{if(confirm('Xoá dữ liệu chấm công ngày '+vdy(k)+'?')){S.r[k]={};touch(k,'Xoá');sh.classList.remove('on');render()}}}

function range(){return Object.keys(S.r).sort().filter(k=>k>=TA&&k<=TB&&S.r[k].in)}
function vStat(){
  $('#v').innerHTML=`<h3>Thống kê</h3><label>Từ ngày<input type="date" id="sa" value="${TA}"></label><label>Đến ngày<input type="date" id="sb" value="${TB}"></label>
  <div id="sr"></div>`;
  const go=()=>{TA=$('#sa').value||TA;TB=$('#sb').value||TB;if(TA>TB){$('#sr').innerHTML='<p class="mute">Ngày bắt đầu phải trước ngày kết thúc.</p>';return}
    const ks=range(),today=key(new Date()),z=()=>({n:0,c:0,ot:0}),A={wd:z(),wn:z(),sd:z(),sn:z()};let w=0,late=0,early=0,miss=0;
    ks.forEach(k=>{const r=S.r[k],c=calc(r);if(c.late>0)late++;if(!r.out){if(k<today)miss++;return}
      const g=A[(new Date(k+'T00:00:00').getDay()==0?'s':'w')+(c.night?'n':'d')];g.n++;g.c+=c.cong;g.ot+=c.ot;w+=c.work;if(c.early>0)early++});
    const ft=m=>Math.floor(m/60)+' giờ '+p2(m%60)+' phút',cg=A.wd.c+A.wn.c+A.sd.c+A.sn.c,tot=A.wd.ot+A.wn.ot+A.sd.ot+A.sn.ot;
    const blk=(h,a,b)=>`<div class="card"><h3>${h}</h3>${row('Ca ngày',a.n+' ngày · '+a.c.toFixed(2)+' công')}${row('OT ca ngày',ft(a.ot))}${row('Ca đêm',b.n+' ca · '+b.c.toFixed(2)+' công')}${row('OT ca đêm',ft(b.ot))}</div>`;
    $('#sr').innerHTML=`<p class="mute">${vdy(TA)} → ${vdy(TB)}${S.a.name?' · '+esc(S.a.name):''}</p>${blk('Thứ 2 – Thứ 7',A.wd,A.wn)}${blk('Chủ nhật',A.sd,A.sn)}<div class="card"><h3>Tổng cộng</h3>${row('Tổng công',cg.toFixed(2)+' công')}${row('Tổng giờ làm',ft(w))}${row('Tổng OT',ft(tot))}${row('Đi muộn',late+' lần')}${row('Về sớm',early+' lần')}${row('Thiếu chấm công',miss+' ngày')}</div>
    <div class="btns"><button class="pri" id="xx">Xuất Excel</button><button id="xv">Xuất CSV</button></div>`;
    $('#xx').onclick=()=>exp('xlsx');$('#xv').onclick=()=>exp('csv')};
  $('#sa').onchange=go;$('#sb').onchange=go;go()}

async function dl(name,data){
  try{const b=new Blob([data],{type:name.endsWith('.csv')?'text/csv;charset=utf-8':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Đã lưu '+name)}catch(e){toast('Không lưu được file')}}
function exp(type){
  const ks=range();if(!ks.length){toast('Không có dữ liệu trong khoảng này');return}
  const head=['Ngày','Thứ','Ca','Giờ vào','Giờ ra','Giờ làm','Công','OT ngày','OT đêm','Ghi chú'];
  const rows=ks.map(k=>{const r=S.r[k],c=calc(r);return[vd(k),['CN','T2','T3','T4','T5','T6','T7'][new Date(k+'T00:00:00').getDay()],c.night?'Đêm':'Ngày',t2(c.ei),c.eo!=null?t2(c.eo):'',c.work!=null?f(c.work):'',c.cong!=null?c.cong:'',!c.night&&c.ot!=null?f(c.ot):'',c.night&&c.ot!=null?f(c.ot):'',r.note||'']});
  const nm=TA.slice(0,7)==TB.slice(0,7)?TA.slice(5,7)+'_'+TA.slice(0,4):TA+'_'+TB,file='ChamCong_'+(S.a.name?S.a.name.replace(/[\\/:*?"<>|\s]+/g,'_')+'_':'')+nm;
  if(type=='csv'){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    dl(file+'.csv','\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'));return}
  if(!window.XLSX){toast('Chưa tải được thư viện Excel, hãy dùng CSV');return}
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=[8,6,6,10,10,10,8,9,9,30].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Chấm công');
  dl(file+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}))}

function vSet(){
  const s=S.s,tm=[['start','Giờ bắt đầu'],['end','Giờ kết thúc'],['lunch','Nghỉ trưa'],['std','Thời gian làm chuẩn'],['ot','Bắt đầu tính OT'],['nStart','Ca đêm: vào từ giờ này'],['nEnd','Ca đêm: giờ kết thúc (quá giờ này tính OT)'],['nBreak','Ca đêm: nghỉ giữa ca']];
  const dn=[[1,'Thứ 2'],[2,'Thứ 3'],[3,'Thứ 4'],[4,'Thứ 5'],[5,'Thứ 6'],[6,'Thứ 7'],[0,'Chủ nhật']];
  $('#v').innerHTML=`<h3>Cài đặt</h3><div class="card" style="margin:0 0 12px"><b>${esc(S.a.name)}</b> <span class="mute">(${esc(S.a.user)})</span><div class="btns"><button id="sy">Đồng bộ ngay</button><button class="danger" id="lo">Đăng xuất</button></div></div>${tm.map(a=>`<label>${a[1]}<input type="time" id="c_${a[0]}" value="${s[a[0]]}"></label>`).join('')}
  <label>Chỉ tính OT khi làm quá (phút)<input type="number" min="0" step="5" id="c_om" value="${s.otMin}"></label>
  <label class="chk"><input type="checkbox" id="c_lc" ${s.lateCut?'checked':''}> Đi muộn thì trừ công theo giờ làm thực tế</label>
  <h3 style="margin-top:16px">Ngày làm việc</h3><div class="days">${dn.map(a=>`<label class="chk"><input type="checkbox" class="cd" value="${a[0]}" ${s.days.includes(a[0])?'checked':''}> ${a[1]}</label>`).join('')}</div>
  <div class="btns"><button class="pri" id="cs">Lưu</button></div>
  <p class="mute">Vào sớm được tính từ giờ bắt đầu, không tính OT. Ra về chưa quá ngưỡng OT thì tính đúng giờ kết thúc. Dữ liệu lưu ngay trong trình duyệt này, hãy xuất Excel/CSV cuối tháng để giữ bản sao.</p>`;
  $('#cs').onclick=()=>{tm.forEach(a=>{const v=$('#c_'+a[0]).value;if(v)s[a[0]]=v});s.lateCut=$('#c_lc').checked;s.otMin=Math.max(0,parseInt($('#c_om').value)||0);
    s.days=[...document.querySelectorAll('.cd')].filter(e=>e.checked).map(e=>+e.value);S.su=Date.now();S.sd=1;save();sync();toast('Đã lưu cài đặt')};$('#sy').onclick=()=>sync(true);$('#lo').onclick=logout}
render();sync();addEventListener('online',()=>sync());document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});setInterval(()=>sync(),300000);
</script></body></html>
